<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CRUD con Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body >


<header>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Happykids</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="empleado.html">Empleados</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="inventario.html">Inventario</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="inicioDeSesion.html">Inicio de sesión</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="index.html">Registrarse</a>
                </li>
            </ul>
            </div>
        </div>
    </nav>
  </header>

<main class="bg-light min-vh-100 d-flex">
<div class="container mt-5">
  <h2 class="text-center mb-4">Empleados</h2>


  <!-- Formulario -->
  <form id="formulario" class="card p-4 shadow-sm">
    <input type="hidden" id="id">

    <div class="mb-3">
      <label class="form-label">Nombres</label>
      <input type="text" id="nombres" class="form-control" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Apellidos</label>
      <input type="text" id="apellidos" class="form-control" required>
    </div>

    
    <div class="mb-3">
      <label class="form-label">Cargo</label>
      <input type="text" id="cargo" class="form-control" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Telefono</label>
      <input type="text" id="telefono" class="form-control" required>
    </div>

        <div class="mb-3">
        <label class="form-label">Correo</label>
        <input type="email" id="correo" class="form-control" required>
      </div>


    <button type="submit" class="btn btn-primary">Guardar</button>
  </form>

  <!-- Tabla -->
  <table class="table table-striped mt-4">
    <thead class="table-dark">
      <tr>
        <th>Nombres</th>
        <th>Apellidos</th>
        <th>Cargo</th>
        <th>Telefono</th>
        <th>Correo</th>  
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tabla"></tbody>
  </table>
</div>

<script>
let datos = [];

const formulario = document.getElementById('formulario');
const tabla = document.getElementById('tabla');

formulario.addEventListener('submit', function(e) {
  e.preventDefault();

  const id = document.getElementById('id').value;
  const nombres = document.getElementById('nombres').value;
  const apellidos = document.getElementById('apellidos').value;
  const cargo = document.getElementById('cargo').value;
  const telefono = document.getElementById('telefono').value;
  const correo = document.getElementById('correo').value;

  if (id) {
    // Editar
    datos = datos.map(item => item.id == id ? { id, nombres, apellidos, cargo, telefono, correo } : item);
  } else {
    // Crear
    datos.push({
      id: Date.now(),
      nombres,
      apellidos,
      cargo,
      telefono,
      correo
    });
  }

  formulario.reset();
  document.getElementById('id').value = '';
  mostrarDatos();
});

function mostrarDatos() {
  tabla.innerHTML = '';
  datos.forEach(item => {
    tabla.innerHTML += `
      <tr>
        <td>${item.nombres}</td>
        <td>${item.apellidos}</td>
        <td>${item.cargo}</td>
        <td>${item.telefono}</td>
        <td>${item.correo}</td>

        <td>
          <button class="btn btn-warning btn-sm" onclick="editar(${item.id})">Editar</button>
          <button class="btn btn-danger btn-sm" onclick="eliminar(${item.id})">Eliminar</button>
        </td>
      </tr>
    `;
  });
}

function editar(id) {
  const item = datos.find(d => d.id == id);
  document.getElementById('id').value = item.id;
  document.getElementById('nombres').value = item.nombres;
  document.getElementById('apellidos').value = item.apellidos;
  document.getElementById('cargo').value = item.cargo;
  document.getElementById('telefono').value = item.telefono;
  document.getElementById('correo').value = item.correo;
}

function eliminar(id) {
  datos = datos.filter(d => d.id != id);
  mostrarDatos();
}
</script>
</main>
</body>
</html>
